<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API</title>
</head>
<body>
    <h1>TESTANDO: GET</h1>

    <button id='carregar-user' type="button">
        Carregar Usuários
    </button>

    <div id="listar-usuarios">
        <!-- carregando todos os usuários -->
    </div>

    <br><hr>

    <h1>TESTANDO: POST</h1>

    <form id="form-post" action="" methods="POST">
        Nome: <input id="nome-post" type="text" required><br>
        Idade: <input id="idade-post" type="text" required><br>

        <button type="submit">Enviar</button>
    </form>

    <br><hr>

    <h1>TESTANDO: PUT</h1>

    <form id="form-put" action="" methods="PUT">
        ID: <input id="id-put" type="text" required><br>
        Nome: <input id="nome-put" type="text" required><br>
        Idade: <input id="idade-put" type="text" required><br>

        <button type="submit">Enviar</button>
    </form>

    <br><hr>

    <h1>TESTANDO: DELETE</h1>

    <form id="form-delete" action="" methods="PUT">
        ID: <input id="id-delete" type="text" required><br>

        <button type="submit">DELETAR USER</button>
    </form>

    <script src="../static/js/user.js"></script>
</body>
</html>
